<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Package structure</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8496"/>
    </marker>
    <marker id="arrow-ev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb0ff"/>
    </marker>
    <style>
      .box { fill: #1c1f28; stroke: #343a4c; stroke-width: 1.5; }
      .pkg { fill: #e7e9ef; font-size: 15px; font-weight: 700; }
      .cls { fill: #b4bac8; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .role { fill: #8b91a1; font-size: 12.5px; }
      .dep { stroke: #7c8496; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .ev { stroke: #9fb0ff; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow-ev); }
      .evlbl { fill: #9fb0ff; font-size: 12px; }
      .title { fill: #e7e9ef; font-size: 17px; font-weight: 700; }
      .sub { fill: #8b91a1; font-size: 13px; }
      .bar-entry { fill: #7c8cff; }
      .bar-view { fill: #4cc9f0; }
      .bar-ctl { fill: #3ddc97; }
      .bar-ai { fill: #f7a859; }
      .bar-model { fill: #c792ea; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="520" rx="16" fill="#12141a"/>
  <text class="title" x="28" y="38">io.github.soloyes.tictactoe</text>
  <text class="sub" x="28" y="60">Solid arrows: "uses". Dashed: listener callbacks that repaint the window. No static or global game state.</text>

  <!-- App -->
  <rect class="box" x="300" y="80" width="200" height="62" rx="10"/>
  <rect class="bar-entry" x="300" y="80" width="6" height="62" rx="3"/>
  <text class="pkg" x="320" y="104">App</text>
  <text class="role" x="320" y="126">parses flags, picks a front end</text>

  <!-- view.swing -->
  <rect class="box" x="60" y="178" width="290" height="92" rx="10"/>
  <rect class="bar-view" x="60" y="178" width="6" height="92" rx="3"/>
  <text class="pkg" x="80" y="202">view.swing</text>
  <text class="role" x="170" y="202">default</text>
  <text class="cls" x="80" y="226">GameWindow · GamePanel · BoardPanel</text>
  <text class="cls" x="80" y="246">StatusBar · SegmentedControl</text>
  
  <!-- view.console -->
  <rect class="box" x="450" y="178" width="290" height="92" rx="10"/>
  <rect class="bar-view" x="450" y="178" width="6" height="92" rx="3"/>
  <text class="pkg" x="470" y="202">view.console</text>
  <text class="role" x="578" y="202">--console</text>
  <text class="cls" x="470" y="226">ConsoleGame</text>
  <text class="role" x="470" y="248">reads "row col", prints the board</text>

  <!-- controller -->
  <rect class="box" x="230" y="306" width="340" height="80" rx="10"/>
  <rect class="bar-ctl" x="230" y="306" width="6" height="80" rx="3"/>
  <text class="pkg" x="250" y="330">controller</text>
  <text class="role" x="340" y="330">turns, score, settings</text>
  <text class="cls" x="250" y="354">GameController · GameSettings</text>
  <text class="cls" x="250" y="373">GameListener · Score · FirstPlayer</text>

  <!-- ai -->
  <rect class="box" x="60" y="420" width="300" height="80" rx="10"/>
  <rect class="bar-ai" x="60" y="420" width="6" height="80" rx="3"/>
  <text class="pkg" x="80" y="444">ai</text>
  <text class="role" x="104" y="444">minimax + alpha-beta</text>
  <text class="cls" x="80" y="468">MoveStrategy · ComputerPlayer</text>
  <text class="cls" x="80" y="487">Minimax · Heuristic · Difficulty</text>

  <!-- model -->
  <rect class="box" x="440" y="420" width="300" height="80" rx="10"/>
  <rect class="bar-model" x="440" y="420" width="6" height="80" rx="3"/>
  <text class="pkg" x="460" y="444">model</text>
  <text class="role" x="514" y="444">pure game rules</text>
  <text class="cls" x="460" y="468">Board · Mark · Line · Outcome</text>
  <text class="role" x="460" y="488">no dependencies</text>

  <!-- dependencies -->
  <path class="dep" d="M360,142 L240,176"/>
  <path class="dep" d="M440,142 L560,176"/>
  <path class="dep" d="M400,142 C400,200 400,250 400,304"/>
  <path class="dep" d="M240,270 L320,304"/>
  <path class="dep" d="M560,270 L480,304"/>
  <path class="dep" d="M330,386 L250,418"/>
  <path class="dep" d="M470,386 L550,418"/>
  <path class="dep" d="M360,460 L438,460"/>

  <!-- listener events -->
  <path class="ev" d="M230,346 C150,346 120,310 120,272"/>
  <text class="evlbl" x="70" y="300">gameChanged()</text>
</svg>
